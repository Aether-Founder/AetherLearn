<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      background: var(--background, #f8fafc);
      color: var(--foreground, #0f172a);
    }
    
    .visual-container {
      max-width: 100%;
      padding: 20px;
      border-radius: 8px;
      background: var(--card, #ffffff);
      border: 1px solid var(--border, #e2e8f0);
    }
    
    .visual-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 16px;
      color: var(--foreground, #0f172a);
    }
    
    .interactive-box {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 150px;
      border-radius: 6px;
      background: var(--secondary, #f1f5f9);
      border: 2px solid var(--border, #e2e8f0);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .interactive-box:hover {
      background: var(--primary, #3b82f6);
      border-color: var(--primary, #3b82f6);
      transform: scale(1.02);
    }
    
    .interactive-box:hover .box-text {
      color: var(--primary-foreground, #ffffff);
    }
    
    .box-text {
      font-size: 16px;
      color: var(--muted-foreground, #64748b);
      transition: color 0.3s ease;
    }
    
    .caption {
      margin-top: 12px;
      font-size: 14px;
      color: var(--muted-foreground, #64748b);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="visual-container">
    <div class="visual-title">Example Interactive Visual</div>
    <div class="interactive-box" onclick="this.style.background = 'var(--success, #22c55e)'">
      <span class="box-text">Click me to interact!</span>
    </div>
    <div class="caption">This is an example of an external HTML visual loaded via visual-placeholder</div>
  </div>
  
  <script>
    // Example JavaScript for interactivity
    const box = document.querySelector('.interactive-box');
    let clickCount = 0;
    
    box.addEventListener('click', () => {
      clickCount++;
      const text = box.querySelector('.box-text');
      text.textContent = `Clicked ${clickCount} times!`;
    });
  </script>
</body>
</html>
